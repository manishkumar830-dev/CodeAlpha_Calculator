<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <h1 class="title">Simple Calculator</h1>

    <div class="calculator">

      <!-- Display: small line for the running expression, big line for the current number -->
      <div class="display" aria-live="polite">
        <div class="expression" id="expression"></div>
        <div class="result" id="result">0</div>
      </div>

      <!--
        Keypad. Every button has:
        data-action = what kind of button it is
        data-value  = the number or operator it represents
        data-key    = the keyboard key that triggers it
      -->
      <div class="keypad" id="keypad">
        <button class="btn btn-function" data-action="clear"   data-key="Escape">AC</button>
        <button class="btn btn-function" data-action="delete"  data-key="Backspace" aria-label="Delete">DEL</button>
        <button class="btn btn-function" data-action="percent" data-key="%" aria-label="Percent">%</button>
        <button class="btn btn-operator" data-action="operator" data-value="/" data-key="/" aria-label="Divide">÷</button>

        <button class="btn" data-action="number" data-value="7" data-key="7">7</button>
        <button class="btn" data-action="number" data-value="8" data-key="8">8</button>
        <button class="btn" data-action="number" data-value="9" data-key="9">9</button>
        <button class="btn btn-operator" data-action="operator" data-value="*" data-key="*" aria-label="Multiply">×</button>

        <button class="btn" data-action="number" data-value="4" data-key="4">4</button>
        <button class="btn" data-action="number" data-value="5" data-key="5">5</button>
        <button class="btn" data-action="number" data-value="6" data-key="6">6</button>
        <button class="btn btn-operator" data-action="operator" data-value="-" data-key="-" aria-label="Subtract">−</button>

        <button class="btn" data-action="number" data-value="1" data-key="1">1</button>
        <button class="btn" data-action="number" data-value="2" data-key="2">2</button>
        <button class="btn" data-action="number" data-value="3" data-key="3">3</button>
        <button class="btn btn-operator" data-action="operator" data-value="+" data-key="+" aria-label="Add">+</button>

        <button class="btn btn-zero" data-action="number" data-value="0" data-key="0">0</button>
        <button class="btn" data-action="decimal" data-key="." aria-label="Decimal point">.</button>
        <button class="btn btn-equals" data-action="equals" data-key="Enter" aria-label="Equals">=</button>
      </div>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
